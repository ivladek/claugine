{% load i18n %}<p style="margin:14px 0 4px"><strong>{% trans "Organizations and projects in the period" %}</strong></p>
{% if changes %}<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%;font-size:13px">
{% for c in changes %}<tr style="border-top:1px solid #eef0ee;vertical-align:top"><td style="padding:3px 6px 3px 0;white-space:nowrap">{{ c.label }}</td><td style="padding:3px 6px;text-align:right"><strong>{{ c.n }}</strong></td><td style="padding:3px 0 3px 6px;color:#6b736e">{{ c.names }}</td></tr>{% endfor %}</table>
{% else %}<p style="margin:0;color:#6b736e">{% trans "No changes." %}</p>{% endif %}
