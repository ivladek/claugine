---
# Custom View - groupadmin

resource_name: "VM"


actions:
  backup: true  
  chgrp: false
  chown: true
  create_dialog: true
  edit_labels: true
  poweroff-hard: true
  poweroff: true
  rdp: true
  reboot-hard: true
  reboot: true
  restore: true
  resume: true
  save_as_template: true
  ssh: true
  terminate-hard: true
  terminate: true
  update-user-template: true
  vnc: true


filters:
  state: true
  owner: true
  group: false
  type: true
  locked: false
  ips: true
  hostname: false


info-tabs:

  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: true
    permissions_panel:
      enabled: false
      actions:
        chmod: false
    ownership_panel:
      enabled: true
      actions:
        chown: true
        chgrp: false
    capacity_panel:
      enabled: true
      actions:
        resize: true
    lxc_panel:
      enabled: false
      actions:
        copy: false
        add: false
        edit: false
        delete: false
    monitoring_panel:
      enabled: true
      actions:
        copy: true
    attributes_panel:
      enabled: true
      actions:
        copy: true
        add: true
        edit: true
        delete: true

  storage:
    enabled: true
    actions:
      disk-attach-image: true
      disk-attach-volatile: true
      disk-detach: true
      disk-snapshot-create: true
      disk-snapshot-delete: true
      disk-snapshot-rename: true
      disk-snapshot-revert: true
      disk-resize: true
      disk-saveas: true

  network:
    enabled: true
    actions:
      nic-attach: true
      nic-attach-alias: true
      nic-detach: true
      nic-update: true
      sg-attach: true
      sg-detach: true
      
  pci:
    enabled: true
    actions:
      pci-attach: true
      pci-detach: true      

  snapshot:
    enabled: true
    actions:
      snapshot-create: true
      snapshot-revert: true
      snapshot-delete: true

  backup:
    enabled: true
    actions:
      backup-configure: true
      backup-create: true
      backup-restore: true

  history:
    enabled: true

  sched_actions:
    enabled: true
    actions:
      sched-add: true
      sched-update: true
      sched-delete: true
      charter_create: true

  configuration:
    enabled: true
    actions:
      update_configuration: true

  template:
    enabled: true
