---
# Custom View - groupadmin

resource_name: "VM-TEMPLATE"


features:
  hide_cpu: true
  cpu_factor: 1


actions:
  create_dialog: true
  import_dialog: false
  update_dialog: true
  instantiate_dialog: true
  create_app_dialog: false # reference to create_dialog in marketplace-app-tab.yaml
  clone: true
  delete: true
  chown: true
  chgrp: false
  lock: false
  unlock: false
  share: false
  unshare: false
  edit_labels: false


filters:
  owner: false
  group: true
  locked: false
  vrouter: true


info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: true
    permissions_panel:
      enabled: false
      actions:
        chmod: false
    ownership_panel:
      enabled: true
      actions:
        chown: true
        chgrp: false

  template:
    enabled: true


dialogs:
  instantiate_dialog:
    information: true
    ownership: true
    capacity: true
    vm_group: false
    network: true
    storage: true
    pci: true
    placement: false
    sched_action: true
    booting: true
  create_dialog:
    ownership: true
    capacity: true
    showback: false
    vm_group: false
    network: true
    storage: true
    pci: true
    placement: true
    input_output: true
    sched_action: true
    context: true
    booting: true
    numa:
      enabled: true
      not_on:
        - lxc
    backup: true
