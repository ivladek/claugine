{% load i18n %}<button class="copy-btn" type="button" {% if url %}data-copy-url="{{ url }}" data-copy-name="s{{ pk }}-{{ field }}"{% else %}data-copy-text="{{ text }}"{% endif %} title="{% trans 'Copy to the clipboard' %}{% if url %} ({% trans 'logged' %}){% endif %}" aria-label="{% trans 'Copy to the clipboard' %}">⧉</button>
