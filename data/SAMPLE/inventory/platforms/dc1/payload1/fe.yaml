name: payload1_dc1

mode: primary
# single - 1 node, no federation
# local - 3 nodes, no federation
# primary - 3 nodes, federation, primary site
# secondary - 3 nodes, federation, secondary site
secondaries:                 # primary only: the FEs of the secondary platforms of the federation
  - platforms.dc2.payload1.fe

type: vm
# vm - installed in dedicated VM
# host - installed on host OS

nodes:
  - sdc1p1one1
  - sdc1p1one2
  - sdc1p1one3
nic: eth0
vip: 10.71.101.30
hostname: sdc1p1one

secrets: secrets.acme.payload1.one

empty_bridges: cleanup
# keep - don't delete empty bridges on KVM host
# cleanup - delete an empty bridge on KVM host if no VM uses it
