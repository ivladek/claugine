# OpenNebula Front-Ends

repos:
  - opennebula

packages:
  - nfs-common
  - mysql-server
  - opennebula
  - opennebula-fireedge
  - opennebula-gate
  - opennebula-flow
  - opennebula-prometheus

services:
  - opennebula
  - opennebula-fireedge
  - opennebula-flow
  - opennebula-gate

services_all:
  - opennebula
  - opennebula-fireedge
  - opennebula-flow
  - opennebula-gate
  - mysql

nodes_order:
  direct:
    - leader
    - follower1
    - follower2
  reversed:
    - follower2
    - follower1
    - leader

config_dirs:
  - ~
  - ~/.ssh
  - ~/.one
  - /etc/one
  - /etc/one/fireedge/sunstone/views
  - /var/lib/one
  - /var/lib/one/.ssh
  - /var/lib/one/.one
  - /var/lib/one/backups/config
  - /var/lib/one/remotes/vnm/vxlan
  - /var/lib/one/remotes/etc/vnm

backup:
  dirs:
    - /etc/one
    - /var/lib/one/.ssh
    - /var/lib/one/.one
    - /var/lib/one/remotes
  days: 10

fireedge_views:
  dir: opennebula-fireedge-views/custom
  list:
    - user
    - groupadmin

configs:
  oned:
    vm_operations:
      ADMIN: delete, deploy, hold, migrate, recover, release, resched, retry, stop, suspend, vmgroup, undeploy
      MANAGE: backup, disk-attach, disk-resize, disk-saveas, disk-snapshot, exec, nic-attach, pci-attach, poweroff, reboot, rename, resize, restore, resume, sched-action, sg-attach, snapshot, terminate, update, updateconf
      USE: 


timeouts:
  data_refresh: 300      # platform context older than this is refreshed before a command
  host_disable: 180
  host_enable: 180
  host_flush: 1800
  image_wait: 300
  vm_wait: 300           # a VM reaching a state



objects:
  - cluster
  - datastore
  - group
  - host
  - image
  - marketapp
  - secgroup
  - template
  - user
  - vm
  - vnet
  - vntemplate
  - zone


# OpenNebula state codes
states:

  zone:
    0: enabled         # normal zone state
    1: disabled        # only read only operations are allowed

  node:
    0: solo            # standalone, no HA cluster
    1: candidate       # an election is running and this node wants to become leader
    2: follower        # normal state for a non-leader node
    3: leader          # normal state for the leader node
    4: error           # set by claugine for state -

  host:
    0: INIT
    1: MONITORING_MONITORED
    2: MONITORED
    3: ERROR
    4: DISABLED
    5: MONITORING_ERROR
    6: MONITORING_INIT
    7: MONITORING_DISABLED
    8: OFFLINE

  image:
    0: INIT
    1: READY
    2: USED
    3: DISABLED
    4: LOCKED
    5: ERROR
    6: CLONE
    7: DELETE
    8: USED_PERS
    9: LOCKED_USED
    10: LOCKED_USED_PERS

  vm:                  # VM STATE; ACTIVE - see vm_lcm
    0: INIT
    1: PENDING
    2: HOLD
    3: ACTIVE
    4: STOPPED
    5: SUSPENDED
    6: DONE
    8: POWEROFF
    9: UNDEPLOYED
    10: CLONING
    11: CLONING_FAILURE

  vm_lcm:              # VM LCM_STATE, meaningful only in STATE 3 ACTIVE
    0: LCM_INIT
    1: PROLOG
    2: BOOT
    3: RUNNING
    4: MIGRATE
    5: SAVE_STOP
    6: SAVE_SUSPEND
    7: SAVE_MIGRATE
    8: PROLOG_MIGRATE
    9: PROLOG_RESUME
    10: EPILOG_STOP
    11: EPILOG
    12: SHUTDOWN
    13: CANCEL
    14: FAILURE
    15: CLEANUP_RESUBMIT
    16: UNKNOWN
    17: HOTPLUG
    18: SHUTDOWN_POWEROFF
    19: BOOT_UNKNOWN
    20: BOOT_POWEROFF
    21: BOOT_SUSPENDED
    22: BOOT_STOPPED
    23: CLEANUP_DELETE
    24: HOTPLUG_SNAPSHOT
    25: HOTPLUG_NIC
    26: HOTPLUG_SAVEAS
    27: HOTPLUG_SAVEAS_POWEROFF
    28: HOTPLUG_SAVEAS_SUSPENDED
    29: SHUTDOWN_UNDEPLOY
    30: EPILOG_UNDEPLOY
    31: PROLOG_UNDEPLOY
    32: BOOT_UNDEPLOY
    33: HOTPLUG_PROLOG_POWEROFF
    34: HOTPLUG_EPILOG_POWEROFF
    35: BOOT_MIGRATE
    36: BOOT_FAILURE
    37: BOOT_MIGRATE_FAILURE
    38: PROLOG_MIGRATE_FAILURE
    39: PROLOG_FAILURE
    40: EPILOG_FAILURE
    41: EPILOG_STOP_FAILURE
    42: EPILOG_UNDEPLOY_FAILURE
    43: PROLOG_MIGRATE_POWEROFF
    44: PROLOG_MIGRATE_POWEROFF_FAILURE
    45: PROLOG_MIGRATE_SUSPEND
    46: PROLOG_MIGRATE_SUSPEND_FAILURE
    47: BOOT_UNDEPLOY_FAILURE
    48: BOOT_STOPPED_FAILURE
    49: PROLOG_RESUME_FAILURE
    50: PROLOG_UNDEPLOY_FAILURE
    51: DISK_SNAPSHOT_POWEROFF
    52: DISK_SNAPSHOT_REVERT_POWEROFF
    53: DISK_SNAPSHOT_DELETE_POWEROFF
    54: DISK_SNAPSHOT_SUSPENDED
    55: DISK_SNAPSHOT_REVERT_SUSPENDED
    56: DISK_SNAPSHOT_DELETE_SUSPENDED
    57: DISK_SNAPSHOT
    58: DISK_SNAPSHOT_REVERT
    59: DISK_SNAPSHOT_DELETE
    60: PROLOG_MIGRATE_UNKNOWN
    61: PROLOG_MIGRATE_UNKNOWN_FAILURE
    62: DISK_RESIZE
    63: DISK_RESIZE_POWEROFF
    64: DISK_RESIZE_UNDEPLOYED
    65: HOTPLUG_NIC_POWEROFF
    66: HOTPLUG_RESIZE
    67: HOTPLUG_SAVEAS_UNDEPLOYED
    68: HOTPLUG_SAVEAS_STOPPED
    69: BACKUP
    70: BACKUP_POWEROFF

  datastores:
    0: IMAGE_DS
    1: SYSTEM_DS
    2: FILE_DS
    3: BACKUP_DS
