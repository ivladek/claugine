# VyOS image

url: https://vyos.net/get/stream/
image_name: VyOS Router            # the version is appended

builder:
  cpu: 1
  ram: 1
  image: Empty disk
  disk: 2
  prefix: vyos-builder-
  password: ChangeMeN0W*2026
  wait: 900

# files added to iso
iso:
  dir: vyos                        # in config/files/
  files:                           # added to the ISO by iso_customize
    - name: grub.cfg               # grub.cfg of the installed system, written by vyos-image-prepare
      path: /claugine/
    - name: vyos-image-prepare     # run manually in the live session after "install image"
      path: /claugine/
    - name: vyos-image-finalize    # run by vyos_image_finalize after the first boot
      path: /claugine/
    - name: vyos-postconfig-bootup.script   # VyOS hook, every boot
      path: /claugine/
    - name: vyos-first-run.script  # first boot only
      path: /claugine/
