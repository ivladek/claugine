# VyOS image

url: https://vyos.net/get/stream/
image_name: VyOS Router

vm:
  cpu: 1
  ram: 1
  image: Empty disk
  disk: 2
  hostname: vyos

# files added to iso
iso:
  dir: vyos                        # in config/files/
  files:                           # added to the ISO by iso_customize
    - name: vyos-image-prepare     # run manually in the live session after "install image": the image config
      path: /claugine/
      mode: "0755"
    - name: vyos-postconfig-bootup.script   # VyOS hook of the image, every boot: the context on the first boot or VYOS_CONFIG_REAPPLY=YES
      path: /claugine/
      mode: "0755"

